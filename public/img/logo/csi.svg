    <circle cx="0" cy="0" r="44" stroke="#1D4ED8" stroke-width="1.2" fill="none" />
    
    <!-- CSI Center Diamond / Triangles -->
    <rect x="-22" y="-22" width="44" height="44" fill="#1D4ED8" rx="4" />
