<svg viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <g transform="translate(80, 60)">
    <!-- Cyan Diamond -->
    <rect x="-40" y="-40" width="80" height="80" rx="14" transform="rotate(45)" fill="#00A3E0" />
    <!-- White Circle Outline -->
    <circle cx="0" cy="0" r="30" stroke="#ffffff" stroke-width="3" fill="none" />
    <!-- acm text -->
    <text x="0" y="2" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">acm</text>
    <!-- Chapter text -->
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">Chapter</text>
  </g>
