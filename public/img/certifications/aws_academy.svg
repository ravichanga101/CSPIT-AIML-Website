<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="awsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2e"/>
      <stop offset="50%" stop-color="#081424"/>
      <stop offset="100%" stop-color="#050d18"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="url(#awsBg)"/>
  
  <!-- Isometric Tech Geometric Lines -->
  <path d="M-20 60 L70 -10 M-20 140 L160 -10 M-20 220 L240 -10" stroke="rgba(6, 182, 212, 0.16)" stroke-width="1.5" fill="none"/>
  <path d="M420 140 L330 210 M420 60 L240 210 M420 -20 L160 210" stroke="rgba(6, 182, 212, 0.16)" stroke-width="1.5" fill="none"/>
  
  <path d="M10 170 L80 110 L140 110" stroke="rgba(14, 165, 233, 0.28)" stroke-width="1.5" fill="none"/>
  <path d="M390 170 L320 110 L260 110" stroke="rgba(14, 165, 233, 0.28)" stroke-width="1.5" fill="none"/>
  
  <!-- Subtle Clouds -->
  <path d="M125 58 C125 48 135 40 146 40 C154 40 161 45 164 52 C168 47 175 44 182 44 C193 44 202 52 202 62" stroke="rgba(255, 255, 255, 0.55)" stroke-width="1.5" fill="none"/>
  <path d="M198 58 C198 46 208 36 222 36 C232 36 241 42 245 51 C250 46 257 43 264 43 C276 43 286 52 286 64" stroke="rgba(255, 255, 255, 0.55)" stroke-width="1.5" fill="none"/>
  
  <!-- University Neoclassical Temple Outline -->
  <polygon points="200,42 145,64 255,64" stroke="#ffffff" stroke-width="1.8" fill="none"/>
  <line x1="140" y1="64" x2="260" y2="64" stroke="#ffffff" stroke-width="2"/>
  <line x1="147" y1="69" x2="253" y2="69" stroke="#ffffff" stroke-width="1.4"/>
  
  <!-- Columns -->
  <line x1="157" y1="69" x2="157" y2="100" stroke="#ffffff" stroke-width="2"/>
  <line x1="175" y1="69" x2="175" y2="100" stroke="#ffffff" stroke-width="2"/>
  <line x1="193" y1="69" x2="193" y2="100" stroke="#ffffff" stroke-width="2"/>
  <line x1="211" y1="69" x2="211" y2="100" stroke="#ffffff" stroke-width="2"/>
  <line x1="229" y1="69" x2="229" y2="100" stroke="#ffffff" stroke-width="2"/>
  <line x1="247" y1="69" x2="247" y2="100" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Arch door -->
  <path d="M197 100 L197 86 C197 82 203 82 203 82 C203 82 209 82 209 86 L209 100" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  
  <!-- Steps / Base -->
  <line x1="142" y1="100" x2="262" y2="100" stroke="#ffffff" stroke-width="1.8"/>
  <line x1="138" y1="104" x2="266" y2="104" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Diploma Scroll -->
  <g transform="translate(230, 72)">
    <path d="M8 26 L42 -4 C46 -8 52 -5 54 -1 L50 3 C48 7 42 4 38 8 L4 38 C0 42 -5 39 -8 35 L-4 31 C-2 27 4 30 8 26 Z" stroke="#38bdf8" stroke-width="2" fill="#081424"/>
    <path d="M19 15 L29 25 M15 19 L25 29" stroke="#ffffff" stroke-width="1.4"/>
    <path d="M26 19 Q32 16 38 23 M26 19 Q25 27 32 29" stroke="#06b6d4" stroke-width="1.8" fill="none"/>
  </g>
  
  <!-- Horizontal accent line -->
  <line x1="110" y1="118" x2="290" y2="118" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
  
  <!-- AWS Academy Brand -->
  <g transform="translate(142, 136)">
    <!-- aws text -->
    <text x="0" y="25" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.5">aws</text>
    <!-- smile arrow -->
    <path d="M2 33 C18 41 38 41 52 33" stroke="#ff9900" stroke-width="3" stroke-linecap="round" fill="none"/>
    <polygon points="50,30 57,33 51,36" fill="#ff9900"/>
    <!-- academy text -->
    <text x="64" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="300" font-size="22" fill="#ffffff" letter-spacing="1.2">academy</text>
  </g>
