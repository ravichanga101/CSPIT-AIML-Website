<svg viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <!-- White Background -->
  <rect width="360" height="140" fill="#ffffff"/>

  <!-- EC-COUNCIL in Red bold condensed -->
  <text x="12" y="64" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="36" fill="#D32F2F" letter-spacing="0.5">EC-COUNCIL</text>

  <!-- Vertical Divider Bar -->
  <line x1="228" y1="34" x2="228" y2="72" stroke="#111827" stroke-width="3"/>

  <!-- ACADEMIA in Black bold condensed -->
  <text x="238" y="64" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#111827" letter-spacing="1">ACADEMIA</text>

  <!-- Horizontal Divider Line -->
  <line x1="12" y1="88" x2="348" y2="88" stroke="#111827" stroke-width="2.5"/>

  <!-- PARTNER in spaced uppercase -->
  <text x="180" y="112" font-family="'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#111827" letter-spacing="10" text-anchor="middle">PARTNER</text>
